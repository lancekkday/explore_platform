[project]
name = "search-replay-inspector"
version = "1.0.0"
description = "Search Personalization Replay Inspector — 個性化搜尋事件回放器 (唯讀)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "google-cloud-bigquery>=3.20",
    "streamlit>=1.36",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
