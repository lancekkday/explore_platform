server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/ab-check 跑全 baseline (~3 min)，需要更長 timeout
    location = /api/ab-check {
        proxy_pass         http://backend:8000/api/ab-check;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }
    location = /explore_platform/api/ab-check {
        proxy_pass         http://backend:8000/api/ab-check;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Proxy: served at root (default)
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Proxy: served under /explore_platform/ subpath (EC2)
    location /explore_platform/api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # SPA fallback: serve index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
