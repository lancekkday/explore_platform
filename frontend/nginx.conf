server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/ab-check 跑全 baseline (~3 min)，需要更長 timeout
    location = /api/ab-check {
        proxy_pass         http://backend:8000/api/ab-check;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }
    location = /explore_platform/api/ab-check {
        proxy_pass         http://backend:8000/api/ab-check;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Proxy: served at root (default)
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Proxy: served under /explore_platform/ subpath (EC2)
    location /explore_platform/api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 回放器 (Streamlit) — 掛在主平台路徑下:
    #   http://<host>:<port>/explore_platform/replay/
    # 用變數 + Docker DNS resolver:replay-ui 沒起時 nginx 照常啟動、
    # 主平台不受影響 (該路徑回 502)。Streamlit 需要 websocket (_stcore/stream)。
    location /explore_platform/replay/ {
        resolver           127.0.0.11 valid=30s;
        set                $replay_upstream http://replay-ui:8501;
        proxy_pass         $replay_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;   # websocket 長連線
    }
    # 無尾斜線 → 導到有尾斜線 (Streamlit baseUrlPath 需要)
    location = /explore_platform/replay {
        return 301 $scheme://$http_host/explore_platform/replay/;
    }

    # SPA fallback: serve index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
